name: FTP Deploy to cPanel

on:
  push:
    branches:
      - main # Change this branch if needed

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v2

      # Deploy files via FTP to cPanel
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.1.0
        with:
          server: "ftp.panadero-api.site"
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "./"
          server-dir: "/"
          timeout: 180000 # Timeout set to 3 minutes

      # Restart Node App via SSH
      - name: Restart Node App via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }} # Set this secret to the correct port (e.g., 22)
          script: |
            # (Optionally) Activate the virtual environment for your Node version management
            source /home/areawcmk/nodevenv/apiv4/18/bin/activate
            # Change directory to your Node app folder
            cd /home/areawcmk/apiv4
            # Stop the existing Node.js process if running
            pm2 stop server || echo "PM2 process not found, skipping stop"

            # Pull latest changes (optional)
            git pull origin main || echo "Git pull failed, continuing..."

            # Install dependencies (optional, if your package.json changes)
            npm install --production || echo "npm install failed, continuing..."

            # Start or restart the Node.js app with PM2
            pm2 start server.js --name server --update-env

            # Save PM2 process list so it auto-restarts on reboot
            pm2 save
